# AI Risk Guard - Application Configuration
server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  workers: 4

webhook:
  max_concurrent_analyses: 3
  analysis_timeout_seconds: 300
  max_request_size_bytes: 5242880
  ignored_dirs:
    - ".venv"
    - "venv"
    - "node_modules"
    - "migrations"
    - "vendor"
    - "__pycache__"
    - "site-packages"

logging:
  level: "INFO"
  format: "json"

sarif:
  upload_to_code_scanning: true
  skip_if_all_dismissed: false
  comment_on_pr: true
  update_existing_comment: true

github_app:
  set_pr_labels: true

checks:
  create_check: true
  name: "ai-risk-guard/validation"
  # When false, failures are reported as neutral so the check never blocks merges.
  gating: false

codeql:
  enabled: true
  auto_provision: true
  workflow_branch: "ai-risk-guard/codeql-setup"
  pr_title: "Enable GitHub CodeQL analysis (via AI Risk Guard)"

llm:
  # Quality-ordered Gemini fallback chain (first available wins).
  # As of Aug 2026 the 1.5/2.0/2.5 models are shut down or being retired
  # (2.0 flash family Jun 2026, 2.5 flash Oct 2026), so we use the current
  # GA 3.x line.
  model_fallback_chain:
    - "gemini-3.5-flash"
    - "gemini-3.6-flash"
    - "gemini-3.5-flash-lite"
    - "gemini-3.1-flash-lite"

feedback:
  # Harvest 🚀/👎 reactions on bot PR comments via the Reactions REST API
  # (there is no `reaction` webhook event for GitHub Apps).
  enabled: true
  poll_interval_seconds: 900
  max_comments_per_cycle: 50

triage:
  # LLM confirmation of low-confidence detections. Only findings whose
  # per-type detection_confidence is below min_detection_confidence are sent
  # to Gemini. The default 0.95 triages the FP-prone 0.90 types (SQL, path
  # traversal, SSRF, secrets) while skipping near-certain 0.95 rules.
  enabled: true
  min_detection_confidence: 0.95
  max_findings_per_call: 8

explainer:
  # Context-aware "why this is a risk" text per finding (falls back to the
  # static VULN_METADATA rationale when the LLM is unavailable).
  enabled: true

summary:
  # One-line LLM summary at the top of the PR report (omitted on failure).
  enabled: true

regression_explain:
  # LLM-written plain-language explanation of the regression-test results shown
  # in each finding card. The technical detail block (test counts, pinned test
  # names, mocked env vars, rebind info) is kept collapsed once per file in the
  # Patch & Validation section. Falls back to the deterministic block verbatim
  # when Gemini is unavailable or rate-limited.
  enabled: true
  max_test_names_in_prompt: 20

validation:
  # Deferred re-validation: scans whose sandbox validation failed closed because
  # Docker was unavailable are re-run automatically once Docker comes back, and
  # the existing PR comment/check are updated.
  enabled: true
  poll_interval_seconds: 60
  max_revalidations_per_cycle: 3

ci_runner:
  # CI-runner fallback validation (Phase E): when Docker is unavailable locally,
  # candidates that failed closed are captured and validated on a GitHub-hosted
  # runner via repository_dispatch to workflow_repo, then results are re-injected
  # into a re-analysis pass.
  #
  # Required env vars:
  #   CI_VALIDATION_SECRET — shared secret authenticating runner <-> app calls
  #   CI_VALIDATION_BASE_URL — public base URL (or set base_url below)
  #   CI_VALIDATION_TOKEN — GitHub token allowed to dispatch to workflow_repo
  #     (falls back to the repo's installation token when unset)
  enabled: true
  # Repo that hosts .github/workflows/ai-risk-guard-validate.yml (owner/name).
  # Empty falls back to GITHUB_REPOSITORY, then skips dispatch.
  workflow_repo: ""
  event_type: "ai-risk-guard-validate"
  base_url: ""

deployment:
  # Public-facing URLs used in user-facing output. Leave empty to fall back to
  # the APP_DASHBOARD_URL / SARIF_INFORMATION_URI env vars, then to sensible
  # local defaults in code.
  dashboard_url: ""
  sarif_information_uri: ""
