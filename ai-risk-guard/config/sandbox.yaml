# AI Risk Guard - Sandbox Configuration
docker:
  image: "ai-risk-guard:sandbox"
  dockerfile: "sandbox/Dockerfile.sandbox"  # Auto-build target when image is missing locally
  build_local_image: true                    # Build the sandbox image if pull is not possible
  memory: "512m"
  cpu: 0.5
  pids_limit: 32
  network: "none"
  read_only: true
  tmpfs: "/tmp:rw,noexec,nosuid,size=64m"
  timeout_seconds: 10         # Code execution timeout
  test_timeout_seconds: 60    # Pytest execution timeout (50 tests need more time)
  max_output_bytes: 65536     # Truncate stdout/stderr for code runs
  test_max_output_bytes: 262144  # Truncate pytest output (verbose test output is larger)
  cap_drop: ["ALL"]
  security_opts: ["no-new-privileges"]
  retry_attempts: 2           # Extra Docker/daemon probes before failing closed
  retry_backoff_seconds: 5    # Base backoff between retries (5s, 10s, 20s)