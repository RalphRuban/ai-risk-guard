# AI Risk Guard - Nginx site configuration (Ubuntu 24.04 / Debian)
#
# Install to /etc/nginx/sites-available/ai-risk-guard and symlink from
# /etc/nginx/sites-enabled/. Replace YOUR_HOSTNAME with the public hostname
# (deploy/azure-vm-setup.sh does this automatically).
#
# TLS is provisioned with certbot --nginx (see deploy/azure-vm-setup.sh),
# which rewrites this file to add the :443 server block and an HTTP->HTTPS
# redirect. Because certbot mutates this file, the setup script only copies
# it again when no certificate exists yet (idempotent provisioning).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_HOSTNAME;

    # Webhook cap is 5 MB (MAX_CONTENT_LENGTH / webhook.max_request_size_bytes).
    client_max_body_size 6m;

    # Let certbot prove domain ownership over plain HTTP before TLS exists.
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # The Flask app already applies werkzeug ProxyFix(x_proto=1, x_host=1),
    # so pass the original scheme/host through. certbot's HTTPS block
    # inherits these directives.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # Built SPA assets are content-hashed by Vite -> cache aggressively.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}